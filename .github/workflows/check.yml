name: Check ChordLab

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Python tests
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: lts
      - name: Frontend logic tests
        run: deno test tests/*.test.js
      - name: Whitespace and syntax
        run: |
          git show --format= --check HEAD
          .venv/bin/python -m compileall -q app tools/backup_project.py
