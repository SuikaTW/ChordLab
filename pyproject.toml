[project]
name = "chordlab"
version = "0.1.0"
description = "Private, self-hosted music chord analysis workspace"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "python-multipart>=0.0.20,<1",
  "yt-dlp[default]>=2026.9.15",
  "reportlab>=4.4,<5",
  "authlib>=1.6,<2",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
]

[tool.uv]
package = false
